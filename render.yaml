services:
  - type: web
    name: tender-radar
    runtime: python
    buildCommand: ""
    startCommand: streamlit run streamlit_app.py --server.port 10000 --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: TENDER_RADAR_USERNAME
        sync: false
      - key: TENDER_RADAR_PASSWORD
        sync: false
